<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Dump | ADHD Planner</title>
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav id="nav"></nav>

    <main>
        <div class="header">
            <h1 id="greeting">Brain Dump</h1>
            <p>What's on your mind?</p>
            <img src="brain_img.png" alt="" class="header-img" onerror="this.remove()">
        </div>

        <section class="card brain-dump-section">
            <textarea id="dump-input" placeholder="Jot it here so you don't forget..." maxlength="200"></textarea>
            <div class="btn-row">
                <button class="note-button" id="add-note">
                    <i class="bx bx-note"></i><span>NOTE</span>
                </button>
                <button class="task-button" id="add-task">
                    <i class="bx bx-check-circle"></i><span>TASK</span>
                </button>
                <button class="event-button" id="add-event" aria-label="turn into a reminder">
                    <i class="bx bx-plus"></i>
                </button>
            </div>
        </section>

        <section class="parking-lot-section">
            <div class="section-head">
                <h2>Parking Lot</h2>
                <img src="decoration.png" alt="" onerror="this.remove()">
                <div class="counter" id="counter">0</div>
            </div>
            <div class="list" id="parking-list"></div>
        </section>
    </main>

    <script src="db.js"></script>
    <script src="app.js"></script>
    <script src="index.js"></script>
</body>
</html>
